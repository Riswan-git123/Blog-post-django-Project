<header class="p-3 bg-dark text-white">
    <div class="row">
        <div class="col">
            <h3>Blog</h3>
        </div>
        <div class="col">
            <div class="d-flex justify-content-center gap-3">
                <a class="text-light text-decoration-none" href="{%url 'blog:index'%}">Home</a>
                <a class="text-light text-decoration-none" href="http://127.0.0.1:8000/about">About</a>
                <a class="text-light text-decoration-none" href="http://127.0.0.1:8000/contact">Contact</a>
                
                {% if user.is_authenticated%}
                <a class="text-light text-decoration-none" href="{%url 'blog:dashboard'%}">Dashboard</a>
                <a class="text-light text-decoration-none" href="{%url 'blog:logout'%}">Logout</a>
                {% else %}
                <a class="text-light text-decoration-none" href="/register">Register</a>
                <a class="text-light text-decoration-none" href="/login">Login</a>
                {%endif%}


            </div>
        </div>
    </div>
</header>
