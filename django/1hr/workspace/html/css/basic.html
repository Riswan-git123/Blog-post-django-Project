<style>
    .container
    {
        width: 650px;
        height: 400px;
        border: 2px solid black;
        position: relative;
    }
    .p1
    {
        width: 200px;
        height: 100px;
        border: 2px solid black;
        position: absolute;
        top: 10px;
        left: 10px;
        overflow: hidden;
    }
    .p2
    {
        width: 200px;
        height: 100px;
        border: 2px solid black;
        position: absolute;
        bottom: 10px;
        left: 10px;
    }
    .p1 h4
    { 

        position: absolute;
        left: 10;
    
    }

</style>

<div class="container">
<div class="p1"><h4>hello this </h4></div>
<div class="p2"><h4>hello everyone</h4></div>


</div>
