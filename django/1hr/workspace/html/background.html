<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* gradient
        
        */
        .box1{
            height: 200px;
            width: 200px;
            background: linear-gradient(to right bottom, red 50%,yellow 60%);
        }
        .box2{
            height: 200px;
            width: 200px;
            background: repeating-linear-gradient(to right, red 50%,yellow 60%);
        }
        .box3{
            height: 200px;
            width: 200px;
            background: radial-gradient(red,yellow, green);
        }
        .box4{
            height: 200px;
            width: 200px;
            background: repeating-radial-gradient(red 5%,yellow 10%, green 15%);
        }
    </style>
</head>
<body>
    
    <div class="box1"> </div>  <br><br>
    <div class="box2"> </div>  <br><br>
    <div class="box3"> </div>  <br><br>
    <div class="box4"> </div>  <br><br>

</body>
</html>
